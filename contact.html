<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="styles.css?v=20260806-contact-v2">
</head>
<body>
  <a class="skip-link" href="#main-content">본문으로 건너뛰기</a>
  <header class="site-header">
    <a class="site-identity site-brand site-identity-stack" href="index.html"><span class="identity-role">Literary Critic · Professor</span><span class="identity-name"><span>노대원</span><span aria-hidden="true">|</span><span>Dae-won Noh</span></span></a>
    <nav class="site-nav" aria-label="주 메뉴"><ul>
      <li><a href="index.html">홈</a></li>
      <li><a href="speaking-media.html">강연·언론</a></li>

      <li><a href="research.html">연구</a></li>
      <li><a href="criticism.html">평론</a></li>
      <li><a href="about.html">경력</a></li>
      <li><a href="cv.html">CV</a></li>
      <li><a href="en.html">English</a></li>
    </ul></nav>
  </header>
  <main id="main-content" class="contact-page">
    <section class="contact-shell" aria-labelledby="contact-title">
      <div class="contact-intro">
        <p class="eyebrow">Contact</p>
        <h1 id="contact-title">문의<em> 또는 제안</em></h1>
        <p class="contact-lead">강연·자문·연구·협업에 관한 문의를 남겨 주세요. 입력하신 내용은 <a href="mailto:novel@jejunu.ac.kr">novel@jejunu.ac.kr</a>로 전달됩니다.</p>
        <p class="contact-note">작성 후 문의 보내기를 누르면 Google Apps Script를 통해 바로 전송됩니다.</p>
        <p class="contact-back"><a class="text-link" href="index.html">← 홈페이지로 돌아가기</a></p>
      </div>
      <form class="contact-form" id="contact-form" method="POST" target="contact-submit-frame">
        <div class="contact-field">
          <label for="contact-name">이름</label>
          <input id="contact-name" name="name" type="text" autocomplete="name" required>
        </div>
        <div class="contact-field">
          <label for="contact-email">이메일</label>
          <input id="contact-email" name="email" type="email" autocomplete="email" placeholder="답변을 받으실 이메일 주소" required>
        </div>
        <div class="contact-field">
          <label for="contact-subject">메일 제목</label>
          <input id="contact-subject" name="subject" type="text" maxlength="120" autocomplete="off" placeholder="문의 제목을 입력해 주세요" required>
        </div>

        <div class="contact-field">
          <label for="contact-message">문의 내용</label>
          <textarea id="contact-message" name="message" rows="8" required></textarea>
        </div>
        <button class="cta cta-primary contact-submit" type="submit">문의 보내기 <span aria-hidden="true">↗</span></button>
        <p class="contact-status" id="contact-status" role="status" aria-live="polite"></p>
        <iframe name="contact-submit-frame" id="contact-submit-frame" title="문의 전송 결과" hidden></iframe>
      </form>
    </section>
  </main>
  <footer class="site-footer">제주대학교 국어교육과 · <a href="mailto:novel@jejunu.ac.kr">novel@jejunu.ac.kr</a></footer>
  <script>
    (() => {
      const APPS_SCRIPT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbwX_F_Q-4eHT6JuOxk6r9Vzna7QFOkSGZdqyI8s5d2T2wUPdjChHtZuRWA5cPTnjMfFBg/exec';
      const form = document.getElementById('contact-form');
      const status = document.getElementById('contact-status');
      const submit = form.querySelector('button[type="submit"]');
      const resultFrame = document.getElementById('contact-submit-frame');
      let submissionStarted = false;

      resultFrame.addEventListener('load', () => {
        if (!submissionStarted) return;
        status.textContent = '문의 전송 요청을 완료했습니다. 확인 후 답변드리겠습니다.';
        status.className = 'contact-status is-success';
        submit.disabled = false;
      });

      form.addEventListener('submit', (event) => {
        event.preventDefault();
        const data = Object.fromEntries(new FormData(form).entries());
        if (!data.name.trim() || !data.email.trim() || !data.subject.trim() || !data.message.trim()) {
          status.textContent = '이름, 이메일, 메일 제목, 문의 내용을 모두 입력해 주세요.';
          status.className = 'contact-status is-error';
          return;
        }
        if (!APPS_SCRIPT_ENDPOINT || !APPS_SCRIPT_ENDPOINT.endsWith('/exec')) {
          status.textContent = '관리자 설정이 아직 완료되지 않았습니다. Apps Script 웹앱 URL을 연결해 주세요.';
          status.className = 'contact-status is-error';
          return;
        }

        form.action = APPS_SCRIPT_ENDPOINT;
        submissionStarted = true;
        submit.disabled = true;
        status.textContent = '문의 내용을 전송하는 중입니다…';
        status.className = 'contact-status';
        HTMLFormElement.prototype.submit.call(form);
      });
    })();
  </script>
</body>
</html>
